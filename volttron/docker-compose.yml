version: '3.8'

services:
  volttron:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name: backend # It should be removed to create separate Docker instances for each testcase
    volumes:
      - ./start.sh:/usr/local/bin/start.sh
    command: ["bash", "/usr/local/bin/start.sh"]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/ping >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s