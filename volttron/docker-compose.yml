version: '3.8'

services:
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: building3147
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin
    volumes:
      - ./influxdb-data:/var/lib/influxdb
    expose:
      - "8086"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui  # see below
    image: aems-ui:latest
    depends_on:
      - influxdb
    restart: unless-stopped
    environment:
      HISTORIAN_ENABLE: "true"
      INFLUXDB_DB: "building3147,yuma"
      INFLUXDB_HOST: "influxdb"
      INFLUXDB_DB_HOSTS: "building3147=localhost,yuma=localhost"
      INFLUXDB_ADMIN_USER: "admin"
      INFLUXDB_ADMIN_PASSWORD: "admin"
      AEMS_MANAGER_PATH: "/app/aems-edge/Manager/manager"
      INFLUXDB_HOST_2: "localhost"
      INFLUXDB_ADMIN_USER_2: admin
      INFLUXDB_ADMIN_PASSWORD_2: admin
    volumes:
      - ./certs:/certs           # mount real certs if you have them
      - ./aems-edge/Manager/manager:/app/aems-edge/Manager/manager:ro
    expose:
      - "5100"                   # internal-only
    ports:
      - "8443:8443"                   # internal-only

  ecobee:
    build:
      context: .
      dockerfile: Dockerfile.ecobee
    image: aems-ecobee:latest
    restart: unless-stopped
    expose:
      - "5005"                  # internal-only
  
  modbus:
    build:
      context: .
      dockerfile: Dockerfile.modbus
    image: aems-modbus:latest
    restart: unless-stopped
    expose:
      - "5008"                  # internal-only


  egauge:
    build:
      context: .
      dockerfile: Dockerfile.egauge
    image: aems-egauge:latest
    restart: unless-stopped
    expose:
      - "5006"                  # internal-only
    ports:
      - "47808:47808/udp"
    volumes:
      - ./test/egauge_topic.csv:/app/egauge_topic.csv:ro
    environment:
      - LOCAL_ADDRESS=0.0.0.0:47808
      - DEVICE_ADDRESS=10.108.1.3:47808

  volttron:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name: backend # It should be removed to create separate Docker instances for each testcase
    volumes:
      - ./start.sh:/usr/local/bin/start.sh
    command: ["bash", "/usr/local/bin/start.sh"]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/ping >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s